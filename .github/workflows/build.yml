name: Build

on:
  workflow_dispatch:
  push:
    branches:
      - master

env:
  DOTNET_VERSION: "10.0.x"

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Restore
        run: dotnet restore NexaERP.slnx

      - name: Build
        run: dotnet build NexaERP.slnx --configuration Release --no-restore

      - name: Test
        run: dotnet test NexaERP.slnx --configuration Release --no-build

      - name: Publish
        run: dotnet publish src/NexaERP.API/NexaERP.API.csproj --configuration Release --no-build
